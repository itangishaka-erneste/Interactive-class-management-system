<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mfasha – AI-Powered Teaching Platform</title>

<meta name="description" content="Mfasha helps teachers organize notes, prepare lessons, create exams and tests, and use AI tools in one place." />  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const updateTitle = () => {
          const page = window.location.pathname
            .split("/")
            .filter(Boolean)
            .pop();
          document.title = page
            ? `${page.replace(/[-_]/g, " ").replace(/\b\w/g, (letter) => letter.toUpperCase())} | ESMS`
            : "ESMS";
        };

        ["pushState", "replaceState"].forEach((method) => {
          const original = history[method];
          history[method] = function (...args) {
            const result = original.apply(this, args);
            updateTitle();
            return result;
          };
        });
        window.addEventListener("popstate", updateTitle);
        updateTitle();
      })();
    </script>
  </body>
</html>
